key: slack
version: 1.0.0
tier: bridge
auth: bot_token
surfaces:
  - key: channel
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 150
      body_max_chars: 4000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "400": PLATFORM_CONTENT_REJECTED
  "500": PLATFORM_UNAVAILABLE
instance_param: base_url
