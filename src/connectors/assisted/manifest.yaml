key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: pack
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 1000
      body_max_chars: 50000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities: [publish, status, delete, build_assist_pack]
error_map:
  "400": DEST_SPEC_VIOLATION
instance_param: base_url
