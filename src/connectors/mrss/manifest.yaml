key: mrss
version: 1.0.0
tier: feed
auth: none
surfaces:
  - key: feed_item
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 255
      body_max_chars: 5000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 120
    per_seconds: 60
capabilities: [publish, status, delete]
error_map:
  "400": DEST_SPEC_VIOLATION
instance_param: base_url
