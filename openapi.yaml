components:
  schemas:
    Body_import_catalogue_api_v1_catalogue_import_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
      type: object
      title: Body_import_catalogue_api_v1_catalogue_import_post
    BuildAssistPackRequest:
      properties:
        rendition:
          $ref: '#/components/schemas/Rendition'
        destination:
          $ref: '#/components/schemas/Destination'
      type: object
      required:
      - rendition
      - destination
      title: BuildAssistPackRequest
    CertifyRequest:
      properties:
        destination_id:
          type: string
          title: Destination Id
        connection:
          anyOf:
          - $ref: '#/components/schemas/Connection'
          - type: 'null'
      type: object
      required:
      - destination_id
      title: CertifyRequest
    ConfirmRulesRequest:
      properties:
        proposal_id:
          type: string
          title: Proposal Id
        confirmed_rules:
          additionalProperties: true
          type: object
          title: Confirmed Rules
        destination_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
      type: object
      required:
      - proposal_id
      - confirmed_rules
      title: ConfirmRulesRequest
    Connection:
      properties:
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        webhook_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Secret
        extra_headers:
          additionalProperties:
            type: string
          type: object
          title: Extra Headers
      type: object
      title: Connection
    DeleteRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
        connection:
          $ref: '#/components/schemas/Connection'
      type: object
      required:
      - platform_post_id
      - connection
      title: DeleteRequest
    Destination:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        platform_key:
          type: string
          title: Platform Key
        surface:
          type: string
          title: Surface
          default: topic
        category:
          type: string
          title: Category
          default: general
        audience_tags:
          items:
            type: string
          type: array
          title: Audience Tags
        language:
          type: string
          title: Language
          default: en
        geo:
          type: string
          title: Geo
          default: global
        est_audience:
          type: integer
          title: Est Audience
          default: 1000
        rules_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Rules Url
        frequency_cap:
          type: string
          title: Frequency Cap
          default: 1/7d
        self_promo_allowed:
          type: boolean
          title: Self Promo Allowed
          default: true
        link_policy:
          type: string
          title: Link Policy
          default: allowed
        disclosure_required:
          type: boolean
          title: Disclosure Required
          default: false
        automation_allowed:
          type: boolean
          title: Automation Allowed
          default: true
        connector_key:
          type: string
          title: Connector Key
        relevance_score:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Relevance Score
          default: 3
        relevance_reason:
          type: string
          title: Relevance Reason
          default: ''
        level:
          type: string
          title: Level
          default: L0
        last_certified_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Certified At
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - name
      - url
      - platform_key
      - connector_key
      title: Destination
    FetchMetricsRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
        connection:
          $ref: '#/components/schemas/Connection'
        since:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      type: object
      required:
      - platform_post_id
      - connection
      title: FetchMetricsRequest
    GetStatusRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
        connection:
          $ref: '#/components/schemas/Connection'
      type: object
      required:
      - platform_post_id
      - connection
      title: GetStatusRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
          default: 0
        result_links:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result Links
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
      type: object
      required:
      - job_id
      - status
      title: JobResponse
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      title: JobStatus
    ProposeRulesRequest:
      properties:
        community_url:
