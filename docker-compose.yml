version: "3.8"

services:
  service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_distribution_service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENV=production
      - SIMULATION_MODE=false
      - DATABASE_URL=sqlite:///./incubrix_ps4.db
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-artifacts
      - MOCK_SERVER_HOST=http://mock_server:8080
      - WEBHOOK_HMAC_SECRET=incubrix-dev-secret-key-32chars-min
    volumes:
      - ./incubrix_ps4.db:/app/incubrix_ps4.db
      - ./storage_data:/app/storage_data
      - ./test_pack:/app/test_pack
      - ./certification_pack:/app/certification_pack
    depends_on:
      - minio
      - mock_server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_mock_platforms
    command: ["uvicorn", "src.mock_server.mock_platforms:mock_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: incubrix_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  ghost:
    image: ghost:5-alpine
    container_name: incubrix_ghost_test
    ports:
      - "2368:2368"
    environment:
      - url=http://localhost:2368
      - NODE_ENV=development

volumes:
  minio_data:
